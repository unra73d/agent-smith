schema: spec-driven

context: |
  Tech stack: Go desktop/server application with a web UI.
  Canonical OpenSpec files under openspec/specs/ are version controlled in Git.
  Jira and Confluence are read-only research sources accessed through Atlassian MCP.

rules:
  proposal:
    - State unresolved decisions explicitly; do not infer material requirements. Design proposal always must include automation tests.
  tasks:
    - Separate production implementation tasks from automated test tasks.

operations:
  apply:
    guidance:
      - Implement only after the user approves the proposal and spec deltas.
      - Delegate production changes to coder and automated coverage to test-writer.
      - Validator must report passing build, vet, tests, and OpenSpec verification before finalization.
  sync:
    guidance:
      - Run only after validator success and explicit user approval.
      - Preserve merged canonical specs under openspec/specs/ in Git.
  archive:
    guidance:
      - Run after sync and before the optional local commit.
