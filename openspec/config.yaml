schema: spec-driven

context: |
  Tech stack: Go desktop/server application with a web UI.
  Canonical OpenSpec files under openspec/specs/ are version controlled in Git.
  Jira and Confluence are read-only research sources accessed through Atlassian MCP.

rules:
  proposal:
    - State unresolved decisions explicitly; do not infer material requirements.
    - For changes to interfaces, state ownership, concurrency, or data flow, explain the existing design intent, why it is insufficient, and why the proposal does not create a parallel path or duplicate ownership.
  design:
    - Include a "## Test Strategy" section.
    - Enumerate every automated test case. For each test, state the test file and function name, setup/inputs/mocks, action under test, expected observable result, and requirement or scenario verified.
    - Cover successful behavior, relevant failure and edge cases, and regression risks found during exploration.
    - Do not use generic entries such as "add tests" or "test the feature". Explain why any accepted requirement has no automated test.
  tasks:
    - Separate production implementation tasks from automated test tasks.
    - Break work into small, ordered, independently verifiable steps. Do not use broad tasks such as "implement feature", "update backend", or "add tests".
    - Every task must identify the owning package or UI component, files to create or modify when known, the concrete implementation action, and its completion evidence.
    - Production tasks must name the behavior, state change, API/event/channel contract, or persistence change they implement and reference the design or requirement they satisfy.
    - Create one automated-test task per test case in the design Test Strategy. Each test task must reference its test file and function name and state the expected assertion.
    - End with explicit validation tasks for the relevant focused tests, `go test ./...`, `go vet ./...`, `go build ./...`, and OpenSpec verification.

operations:
  apply:
    guidance:
      - Implement only after the user approves the proposal and spec deltas.
      - Delegate production changes to coder and automated coverage to test-writer.
      - Validator must report passing build, vet, tests, and OpenSpec verification before finalization.
  sync:
    guidance:
      - Run only after validator success and explicit user approval.
      - Preserve merged canonical specs under openspec/specs/ in Git.
  archive:
    guidance:
      - Run after sync and before the optional local commit.
